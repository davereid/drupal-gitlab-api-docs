name: Autoupdate
on:
  push:
    branches:
      - main
      - '[0-9]*.x' # Not release-please's own release-please--branches--1.x.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoupdate:
    name: Autoupdate
    runs-on: ubuntu-latest
    permissions:
      contents: write # Merge the base branch into pull request branches.
      pull-requests: read # Find the open pull requests to update.
    steps:
      - uses: docker://chinthakagodawita/autoupdate-action@sha256:53d7013ad4689b703d2715d4b17d4901bb0a385e495e0b481f37adbe9b3cc3fc # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
