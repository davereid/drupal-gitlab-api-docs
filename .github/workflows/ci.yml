name: CI

on:
  push:
    branches:
      - main
      - '[0-9]*.x' # Not release-please's own release-please--branches--1.x.
  pull_request:
  schedule:
    - cron: 0 0 * * 1
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code.
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.5']
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: composer validate --strict
      - run: composer install
      - run: composer audit
      - run: composer run test

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false # Fail the job on findings instead of uploading them to code scanning.
